services:
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: p6-fraud-pipeline:latest
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlflow_docker.db
      - DVC_NO_ANALYTICS=1
      - GIT_PYTHON_REFRESH=quiet
    command: ["dvc", "repro", "--force"]
